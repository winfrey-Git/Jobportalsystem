{% extends 'base.html' %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white text-center">
                    <h2>Edit Profile</h2>
                </div>
                <div class="card-body">
                    <form method="post" action="{% url 'edit_profile' %}">
                        {% csrf_token %}
                        
                        {% for message in messages %}
                            <div class="alert alert-success">{{ message }}</div>
                        {% endfor %}
                        
                    
                        <div class="mb-3">
                            <label for="full_name" class="form-label">Full Name</label>
                            <input type="text" id="full_name" name="full_name" class="form-control" value="{{ userprofile.full_name }}" required>
                        </div>

                       
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" value="{{ user.email }}" readonly>
                        </div>

                        
                        <div class="mb-3">
                            <label for="role" class="form-label">Role </label>
                            <input type="text" id="role" class="form-control" value="{{ user.get_role_display }}" readonly>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" id="phone" name="phone" class="form-control" value="{{ userprofile.phone }}">
                        </div>

                   
                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea id="address" name="address" class="form-control">{{ userprofile.address }}</textarea>
                        </div>

                       
                        <div class="mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select id="gender" name="gender" class="form-select">
                                <option value="M" {% if userprofile.gender == 'M' %}selected{% endif %}>Male</option>
                                <option value="F" {% if userprofile.gender == 'F' %}selected{% endif %}>Female</option>
                                <option value="O" {% if userprofile.gender == 'O' %}selected{% endif %}>Other</option>
                            </select>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success">Save Changes</button>
                            <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
