{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h2>Job Test</h2>
    <p>Complete the test within the given time.</p>
    <div id="timer" class="alert alert-danger">Time Left: <span id="time_left"></span></div>

    <form method="POST" action="{% url 'submit_test' application.id %}">
        {% csrf_token %}
        {% for question in application.job.test.questions.all %}
            <div class="mb-3">
                <p><strong>{{ question.text }}</strong></p>
                {% for option in question.get_options %}
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="question_{{ question.id }}" value="{{ option }}">
                        <label class="form-check-label">{{ option }}</label>
                    </div>
                {% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">Submit Test</button>
    </form>
</div>

<script>
    let timeLeft = {{ time_limit }};
    function updateTimer() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        document.getElementById("time_left").innerText = `${minutes}:${seconds}`;
        if (timeLeft <= 0) {
            alert("Time is up! Your test will be submitted.");
            document.forms[0].submit();
        }
        timeLeft--;
    }
    setInterval(updateTimer, 1000);
</script>
{% endblock %}
