{% extends 'base.html' %}
{% block content %}

<section class="site-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-6 mx-auto">
        <h2 class="text-center">Set New Password</h2>
        
        {% if validlink %}
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password1" class="form-control" required placeholder="Enter new password">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="password" name="new_password2" class="form-control" required placeholder="Confirm new password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Reset Password</button>
        </form>
        {% else %}
        <p class="text-danger text-center">The password reset link is invalid or has expired.</p>
        {% endif %}
      </div>
    </div>
  </div>
</section>

{% endblock %}
