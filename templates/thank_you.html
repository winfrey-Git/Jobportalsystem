{% extends 'base.html' %}
{% load static %}
{% block content %}
<section class="section-hero overlay inner-page bg-image" style="background-image: url('{% static 'images/background.jpg' %}');" id="home-section">
  <div class="container">
    <div class="row py-3">
      <div class="col-md-7">
        <h1 class="text-white font-weight-bold">Thank You</h1>
        <div class="custom-breadcrumbs">
          <a href="{% url 'home' %}" class="text-success">Home</a> <span class="mx-2 slash">/</span>
          <span class="text-white"><strong>Thank You</strong></span>
        </div>
      </div>
    </div>
  </div>
</section>
<div class="container mt-5">
    <div class="card text-center p-4">
        <h2 class="text-success">Thank You!</h2>
        <p class="lead">Your message has been received. We'll get back to you as soon as possible.</p>
        <a href="{% url 'home' %}" class="btn btn-success mt-3">Back to Home</a>
    </div>
</div>
