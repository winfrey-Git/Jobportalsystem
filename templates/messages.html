{% if messages %}
  <div class="alert-container position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index: 1050; width: auto; max-width: 400px;">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-lg p-3 rounded" role="alert" style="background: white;">
        <strong>{{ message }}</strong>
        <button type="button" class="close btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>

  <script>
    setTimeout(function() {
      let alerts = document.querySelectorAll(".alert");
      alerts.forEach(alert => {
        let bsAlert = new bootstrap.Alert(alert);
        bsAlert.close();
      });
    }, 5000);
  </script>
{% endif %}
