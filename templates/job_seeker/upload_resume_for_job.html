<!-- upload_resume_for_job.html -->
{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center text-success">Upload Resume for {{ job.title }}</h2>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <form method="post" enctype="multipart/form-data" class="p-4 border rounded bg-white shadow-sm">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Upload Resume</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
