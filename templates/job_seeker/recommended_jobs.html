{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Recommended Jobs</h2>
    {% if recommended_jobs %}
        <div class="list-group">
            {% for job in recommended_jobs %}
                <a href="{% url 'single_job' job.id %}" class="list-group-item list-group-item-action">
                    <h5 class="mb-1">{{ job.title }}</h5>
                    <p class="mb-1 text-muted">{{ job.company_name }}</p>
                    <small>Category: {{ job.category }}</small>
                </a>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-muted">No job recommendations available at the moment.</p>
    {% endif %}
</div>
{% endblock %}
