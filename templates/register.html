{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="d-flex justify-content-center align-items-center min-vh-100 mt-5 mb-5">
  <div class="card shadow p-5 col-md-8 col-lg-5">
    <h1 class="text-center mb-4 text-warning">Create an Account</h1>

    <form method="post" class="needs-validation">
      {% csrf_token %}
      
      {% if messages %}
        {% for message in messages %}
          <p class="alert alert-warning">{{ message }}</p>
        {% endfor %}
      {% endif %}

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="Enter username" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="Enter email" required>
      </div>

      <div class="mb-3">
        <label for="password1" class="form-label">Password</label>
        <input type="password" name="password1" id="password1" class="form-control" placeholder="Enter password" required>
      </div>

      <div class="mb-3">
        <label for="password2" class="form-label">Confirm Password</label>
        <input type="password" name="password2" id="password2" class="form-control" placeholder="Confirm password" required>
      </div>

      <div class="mb-4">
        <label for="role" class="form-label">Role</label>
        <select name="role" id="role" class="form-select" required>
          <option value="" disabled selected>Select your role</option>
          <option value="employer">Employer</option>
          <option value="employee">Employee</option>
        </select>
      </div>

      <button type="submit" class="btn btn-warning w-100">Register</button>
    </form>
  </div>
</section>
{% endblock %}
