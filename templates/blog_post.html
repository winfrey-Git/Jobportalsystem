{% extends 'base.html' %}

{% block title %}{{ post.title }} - My Website{% endblock %}
{% load static %}
{% block content %}
<section class="section-hero overlay inner-page bg-image" style="background-image: url('{% static 'images/background.jpg' %}');" id="home-section">
  <div class="container">
    <div class="row py-3">
      <div class="col-md-12">
        <h1 class="text-white font-weight-bold">{{ post.title }}</h1>
        <div class="custom-breadcrumbs">
          <a href="{% url 'home' %}" class="text-success">Home</a><span class="mx-2 slash">/</span>
          <a href="{% url 'blog_list' %}" class="text-success">Blog</a><span class="mx-2 slash">/</span>
          <span class="text-white"><strong>{{ post.title }}</strong></span>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="blog-post-content py-5" style="background-color: #f8f9fa;">
  <div class="container">
    {% if post.image %}
      <img src="{{ post.image.url }}" alt="{{ post.title }}" class="img-fluid mb-4" style="max-width: 100%; height: auto;">
    {% endif %}
    <div class="blog-post-text">
      <p class="lead">{{ post.content|linebreaksbr }}</p>
    </div>
    <div class="text-center mt-5">
      <a href="{% url 'blog_list' %}" class="btn btn-success btn-lg">← Back to Blog</a>
    </div>
  </div>
</section>
{% endblock %}
