{% extends 'base.html' %}
{% load static %}
{% block content %}

<section class="site-section">
  <div class="container">
    <div class="row">
      <div class="col-lg-6 mx-auto">
        <h2 class="text-center text-dark">Reset Password</h2>
        <p class="text-center text-muted">Enter your email to receive a password reset link.</p>
        
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required placeholder="Enter your email">
          </div>
          <button type="submit" class="btn btn-success w-100">Send Reset Link</button>
        </form>

        <div class="text-center mt-3 mb-3">
          <a href="{% url 'login' %}" class="text-success">Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock %}
