{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Resume Details</h2>
    <hr>

    <p><strong>Applicant:</strong> {{ resume.applicant.get_full_name }}</p>
    <p><strong>Email:</strong> {{ resume.applicant.email }}</p>

    {% if resume.parsed_text %}
        <h4>Extracted Text:</h4>
        <p>{{ resume.parsed_text }}</p>
    {% endif %}

    <a href="{{ resume.file.url }}" class="btn btn-primary" download>Download Resume</a>
    <a href="{% url 'save_resume' resume.id %}" class="btn btn-success">Save Resume</a>
</div>
{% endblock %}
