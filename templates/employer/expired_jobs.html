{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h3 class="text-danger">Expired Jobs</h3>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Title</th>
                <th>Category</th>
                <th>Applications</th>
                <th>Posted Date</th>
            </tr>
        </thead>
        <tbody>
            {% for job in jobs %}
            <tr>
                <td>{{ job.title }}</td>
                <td>{{ job.category }}</td>
                <td>{{ job.applications.count }}</td>
                <td>{{ job.created_at|date:"M d, Y" }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No expired jobs.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
