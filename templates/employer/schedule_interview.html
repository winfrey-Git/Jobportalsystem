{% block content %}
<div class="container mt-4">
    <h2>Schedule Interview</h2>

    {% if messages %}
    <div>
        {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="dashboard-form">
        {% csrf_token %}
        <div class="mb-3">
            <label for="date" class="form-label">Interview Date</label>
            <input type="date" name="date" class="form-control" required 
                   min="{{ current_date|date:'Y-m-d' }}" 
                   max="{{ max_date|date:'Y-m-d' }}">
        </div>
        <div class="mb-3">
            <label for="time" class="form-label">Interview Time</label>
            <input type="time" name="time" class="form-control">
        </div>
        <div class="mb-3">
            <label for="mode" class="form-label">Interview Mode</label>
            <select name="mode" class="form-control">
                <option value="In-Person">In-Person</option>
                <option value="Online">Online</option>
            </select>
        </div>
        <div class="mb-3" id="meeting_link_div">
            <label for="interview_link" class="form-label">Meeting Link (if Online)</label>
            <input type="url" name="interview_link" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Save Interview</button>
        <a href="{% url 'interview_management' %}" class="btn btn-secondary dashbord-load">Cancel</a>
    </form>
</div>
{% endblock %}
