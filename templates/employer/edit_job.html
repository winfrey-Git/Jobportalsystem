{% block content %}
<div class="container mt-5">
    <h2 class="text-center">Edit Job</h2>
    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label">Job Title</label>
            {{ form.title }}
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="4">{{ form.description.value|striptags }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            {{ form.location }}
        </div>

        <div class="mb-3">
            <label class="form-label">Job Type</label>
            {{ form.type }}
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            {{ form.category }}
        </div>

        <div class="mb-3">
            <label class="form-label">Salary</label>
            {{ form.salary }}
        </div>

        <div class="mb-3">
            <label class="form-label">Deadline Date</label>
            {{ form.deadline_date }}
        </div>

        <div class="mb-3">
            <label class="form-label">Vacancies</label>
            {{ form.vacancy }}
        </div>

        <div class="mb-3">
            <label class="form-label">Tags</label>
            {{ form.tags }}
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-control" name="status">
                <option value="open" {% if form.status.value == "open" %}selected{% endif %}>Open</option>
                <option value="closed" {% if form.status.value == "closed" %}selected{% endif %}>Closed</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Responsibilities</label>
            <textarea class="form-control" name="responsibilities" rows="4">{{ form.responsibilities.value|striptags }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Requirements</label>
            <textarea class="form-control" name="requirements" rows="4">{{ form.requirements.value|striptags }}</textarea>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" name="is_published" id="is_published" {% if form.instance.is_published %}checked{% endif %}>
            <label class="form-check-label" for="is_published">Publish Job</label>
        </div>
        
        
        <button type="submit" class="btn btn-success">Update Job</button>
        <a href="{% url 'manage_jobs' %}" class="btn btn-secondary dashboard-load">Cancel</a>
    </form>
</div>

{% endblock %}
