{% extends 'base.html' %}
{% block content %}

<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h4>Delete Profile</h4>
        </div>
        <div class="card-body">
            <p>Are you sure you want to delete your profile? This action is irreversible, and all your job postings will be deleted.</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                <a href="{% url 'view_employer_profile' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
